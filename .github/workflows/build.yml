name: build

# Started by hand: "build php85", or several at once: "84,83,82". Builds every
# version on both processors in parallel, in clean AlmaLinux containers, and
# keeps the packages as artifacts. Signing and publishing to repo.bhpanel.net
# happen only in the "publish" job - ONE for the whole run, so several versions
# need one approval - which runs in the protected "sign" environment.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "PHP version(s), Remi's scl-phpNN: 85, or a list like 84,83,82"
        required: true
        type: string
      publish:
        description: Sign and publish to repo.bhpanel.net (needs approval)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-php-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - id: p
        env:
          V: ${{ inputs.version }}
        run: |
          # Each entry checked against the known versions; nothing else from
          # the input reaches a shell or the matrix.
          out=""
          for v in $(printf '%s' "$V" | tr ',' ' '); do
            case "$v" in
              56|70|71) el=8; arches="x86_64" ;;          # Remi's EL8 aarch64 starts at 7.2
              72|73)    el=8; arches="x86_64 aarch64" ;;
              74|80|81|82|83|84|85|86) el=9; arches="x86_64 aarch64" ;;
              *) echo "unknown version: $v"; exit 1 ;;
            esac
            for a in $arches; do out="$out{\"v\":\"$v\",\"el\":\"$el\",\"arch\":\"$a\"},"; done
          done
          [ -n "$out" ] || { echo "no version given"; exit 1; }
          echo "matrix={\"include\":[${out%,}]}" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: almalinux:${{ matrix.el }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build php${{ matrix.v }} (${{ matrix.arch }})
        run: bash ci/build.sh "${{ matrix.v }}" "out/el${{ matrix.el }}/${{ matrix.arch }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php${{ matrix.v }}-el${{ matrix.el }}-${{ matrix.arch }}
          path: out/
          if-no-files-found: error
          retention-days: 1   # counts against the account's 500 MB until it expires; publish deletes it sooner
  publish:
    # Only when EVERY build succeeded: a half set is not published.
    if: ${{ inputs.publish }}
    needs: [plan, build]
    # One publish at a time across all runs: each starts from the live
    # snapshot, so two at once would drop each other's packages.
    concurrency:
      group: repo-publish
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    container: almalinux:9
    # The signing key lives only here; GitHub waits for the owner's approval
    # (and allows only the main branch) before this job may start.
    environment: sign
    permissions:
      contents: write   # the "repo" release that repo.bhpanel.net pulls
      actions: write    # delete this run's artifacts once published (500 MB)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: php*-el*
          path: new
          merge-multiple: true
      - name: Sign and publish
        env:
          RPM_SIGNING_KEY: ${{ secrets.RPM_SIGNING_KEY }}
          RPM_SIGNING_FPR: ${{ secrets.RPM_SIGNING_FPR }}
          GH_TOKEN: ${{ github.token }}
        run: bash ci/publish.sh new
      - name: Delete this run's artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="https://api.github.com/repos/${{ github.repository }}/actions"
          for id in $(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$api/runs/${{ github.run_id }}/artifacts" | jq -r '.artifacts[].id'); do
            curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$api/artifacts/$id" && echo "deleted artifact $id"
          done
